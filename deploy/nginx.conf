server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    location /images/ {
        proxy_pass http://backend:5000;
        expires 7d;
    }

    # Single-page app: let React Router handle /home, /profile, ...
    location / {
        try_files $uri /index.html;
    }
}
